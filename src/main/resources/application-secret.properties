# Copy to application-secret.properties for local development. Never commit actual credentials.
# Set DB_USERNAME, DB_PASSWORD and JWT_SECRET in your personal run environment.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/keyboard_shop?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
