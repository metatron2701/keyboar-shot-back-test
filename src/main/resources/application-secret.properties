spring.datasource.url=jdbc:mysql://localhost:3306/keyboard_shop?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update

spring.profiles.active=local

server.port=8080

# JWT 만료 시간 (밀리초) - Access 1시간, Refresh 7일
jwt.access-expiration=3600000
jwt.refresh-expiration=604800000

# 프론트 주소 (CORS 허용)
cors.allowed-origin=http://localhost:3000

spring.jpa.open-in-view=false

toss.payments.secret-key=${TOSS_PAYMENTS_SECRET_KEY}
toss.payments.test-enabled=${TOSS_PAYMENTS_TEST_ENABLED}
toss.payments.dev-orders-enabled=${TOSS_PAYMENTS_DEV_ORDERS_ENABLED}
toss.payments.dev-confirm-enabled=${TOSS_PAYMENTS_DEV_CONFIRM_ENABLED}